name: Isolated ARM64 startup validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-arm-build
  cancel-in-progress: false
jobs:
  validate-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 80
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Fetch pinned public upstream source
        run: |
          git init source
          cd source
          git fetch --depth 1 https://github.com/nightly-labs/openbot.git a0b754f8baa8fb49fb200ffb3759b17429a962a9
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = a0b754f8baa8fb49fb200ffb3759b17429a962a9
      - name: Materialize reviewed patch and synthetic tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .
          printf '%s' '' | base64 --decode > startup.patch
          mkdir -p scripts
          printf '%s' '' | base64 --decode > scripts/or-startup-budget-review.ts
          mkdir -p scripts
          printf '%s' '' | base64 --decode > scripts/or-startup-qualified-review.ts
          mkdir -p scripts
          printf '%s' '' | base64 --decode > scripts/or-pre-spawn-review.ts
          mkdir -p scripts
          printf '%s' '' | base64 --decode > scripts/or-runtime-qualified-review.ts
          git apply --check startup.patch
          git apply startup.patch
      - name: Expose pinned Node version
        run: cp source/.nvmrc .nvmrc
      - name: Set up pinned toolchain
        uses: ./source/.github/actions/setup-bun
        with:
          install: none
      - name: Install exact dependencies and launch-check tools
        working-directory: source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xvfb
          bun install --frozen-lockfile
          df -h .
      - name: Typecheck and synthetic lifecycle regressions
        working-directory: source
        run: |
          set -euo pipefail
          bun run typecheck:node
          EXPECT_PATCH=1 bun scripts/or-startup-budget-review.ts
          bun scripts/or-startup-qualified-review.ts
          bun scripts/or-pre-spawn-review.ts
          bun scripts/or-runtime-qualified-review.ts
      - name: Real 120-second silent discovery deadline
        working-directory: source
        timeout-minutes: 4
        run: REAL_DEADLINE=1 bun scripts/or-startup-budget-review.ts
      - name: Install exact ARM provider control artifacts
        working-directory: source
        run: |
          bun scripts/install-codex-runtime.ts linux arm64
          bun scripts/install-claude-runtime.ts linux arm64
          bun scripts/install-grok-runtime.ts linux arm64
      - name: Build ARM64 AppImage
        working-directory: source
        run: bun run dist:linux:arm64
      - name: Permit sandbox for isolated launch check
        working-directory: source
        run: |
          set -euo pipefail
          sudo chown root:root dist/linux-arm64-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-arm64-unpacked/chrome-sandbox
          sudo tee /etc/apparmor.d/openbot-verify <<PROFILE
          abi <abi/4.0>,
          include <tunables/global>
          profile openbot-verify "$GITHUB_WORKSPACE/source/dist/linux-arm64-unpacked/openbot" flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser -r /etc/apparmor.d/openbot-verify
      - name: Verify packaged metadata and launch
        working-directory: source
        run: xvfb-run -a bun run verify:package:linux dist/linux-arm64-unpacked --require-update-metadata
      - name: Build native ARM Docker image and verify signed-out lifecycle
        working-directory: source
        run: |
          set -euo pipefail
          mkdir image
          cp dist/*.AppImage image/OpenBot.AppImage
          sha256sum image/OpenBot.AppImage
          docker build --file docker/Dockerfile --platform linux/arm64 --build-arg VERSION=0.71.0 --build-arg REVISION=a0b754f8baa8fb49fb200ffb3759b17429a962a9 --tag openbot:startup-test image
          trap 'docker logs openbot-test || true; docker stop --time 60 openbot-test || true' EXIT
          docker run --detach --name openbot-test --shm-size 1g --security-opt seccomp=docker/seccomp.json --security-opt no-new-privileges:true openbot:startup-test
          status=
          for _ in $(seq 1 120); do
            if docker exec openbot-test test -S /run/openbot/control.sock; then
              status=$(docker exec openbot-test openbot status)
              grep -Fxq "Account: loading" <<<"$status" || break
            fi
            sleep 1
          done
          echo "$status"
          grep -Fxq "OpenBot 0.71.0" <<<"$status"
          grep -Fxq "Account: signed out. Sign in with: openbot login" <<<"$status"
          docker stop --time 60 openbot-test
          test "$(docker inspect openbot-test --format '{{.State.ExitCode}}')" = 0
          trap - EXIT
          mkdir -p ../artifacts
          docker save openbot:startup-test | gzip --fast > ../artifacts/openbot-arm64-startup-test.tar.gz
          cp image/OpenBot.AppImage ../artifacts/
          cd ../artifacts
          sha256sum * > SHA256SUMS.txt
          du -h *
          size=$(du -sb . | cut -f1)
          echo "Artifact bytes: $size" >> "$GITHUB_STEP_SUMMARY"
          test "$size" -le 400000000
      - name: Export bounded test build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openbot-arm64-startup-test
          path: artifacts/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
